services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: npm run dev -- -H 0.0.0.0 -p 3000
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
    # Load all secrets from .env file so Cloudinary / MongoDB creds are available
    env_file:
      - .env
    volumes:
      # mount source code for hot reload
      - .:/app
      # keep node_modules inside container (avoid mixing host deps)
      - /app/node_modules
      - /app/.next
